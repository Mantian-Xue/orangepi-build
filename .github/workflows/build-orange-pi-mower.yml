name: Build Orange Pi Mower Image

on:
  push:
    branches: [ main, master ]
    paths:
      - 'external/config/templates/customize-image.sh.template'
      - 'userpatches/**'
      - '.github/workflows/build-orange-pi-mower.yml'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      board:
        description: 'Board to build for'
        required: true
        default: 'orangepi5plus'
        type: choice
        options:
          - orangepi5plus
          - orangepi5
          - orangepi4-lts
          - orangepi3-lts
          - orangepipc
      branch:
        description: 'Kernel branch'
        required: true
        default: 'current'
        type: choice
        options:
          - current
          - legacy
          - edge
      release:
        description: 'OS release'
        required: true
        default: 'focal'
        type: choice
        options:
          - focal
          - jammy
          - bullseye
          - bookworm
      build_desktop:
        description: 'Build desktop version'
        required: true
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'
      enable_mower:
        description: 'Enable mower packages'
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'

env:
  BOARD: ${{ github.event.inputs.board || 'orangepi5plus' }}
  BRANCH: ${{ github.event.inputs.branch || 'current' }}
  RELEASE: ${{ github.event.inputs.release || 'focal' }}
  BUILD_DESKTOP: ${{ github.event.inputs.build_desktop || 'no' }}
  ENABLE_MOWER: ${{ github.event.inputs.enable_mower || 'yes' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 480  # 8 hours max
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Need full history for proper git operations
    
    - name: Free up disk space
      run: |
        # Free up disk space by removing unused packages
        sudo apt-get update
        sudo apt-get remove -y '^llvm-.*' '^libllvm.*' '^clang-.*' '^libclang.*'
        sudo apt-get remove -y firefox google-chrome-stable microsoft-edge-stable
        sudo apt-get remove -y dotnet-* aspnetcore-* azure-cli google-cloud-sdk
        sudo apt-get autoremove -y
        sudo apt-get autoclean
        
        # Remove large directories
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
        sudo rm -rf /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go /opt/hostedtoolcache/node
        
        # Show available space
        df -h
    
    - name: Setup Docker environment
      run: |
        # Make sure Docker is available
        sudo systemctl start docker
        sudo systemctl enable docker
        
        # Add current user to docker group
        sudo usermod -aG docker $USER
        
        # Create build directories with proper permissions
        sudo mkdir -p /opt/orangepi-build
        sudo chown -R $USER:$USER /opt/orangepi-build
        
        # Copy source code to build directory
        cp -r . /opt/orangepi-build/
        cd /opt/orangepi-build
        
        # Set up userpatches directory
        mkdir -p userpatches
        
        # Show Docker info
        docker --version
        docker info
    
    - name: Configure build for mower
      if: env.ENABLE_MOWER == 'yes'
      run: |
        cd /opt/orangepi-build
        
        # Enable mower packages in template if not already enabled
        if grep -q "# InstallMowerPackages" external/config/templates/customize-image.sh.template; then
          sed -i 's/# InstallMowerPackages/InstallMowerPackages/' external/config/templates/customize-image.sh.template
          sed -i 's/# ConfigureMowerSystem/ConfigureMowerSystem/' external/config/templates/customize-image.sh.template
        fi
        
        # Create custom config for mower build
        cat > userpatches/config-mower.conf << 'EOF'
        # Mower build configuration
        BOARD="${BOARD}"
        BRANCH="${BRANCH}"
        RELEASE="${RELEASE}"
        BUILD_DESKTOP="${BUILD_DESKTOP}"
        BUILD_MINIMAL="no"
        KERNEL_CONFIGURE="no"
        COMPRESS_OUTPUTIMAGE="sha,7z"
        
        # Optimize for GitHub Actions
        SYNC_CLOCK="no"
        NO_APT_CACHER="yes"
        OFFLINE_WORK="no"
        
        # Image configuration
        FIXED_IMAGE_SIZE="4000"  # 4GB image
        BOOTSIZE="256"           # 256MB boot partition
        EOF
        
        echo "Mower configuration enabled"
    
    - name: Build Orange Pi image
      run: |
        cd /opt/orangepi-build
        
        # Determine config file
        if [[ "$ENABLE_MOWER" == "yes" ]]; then
          CONFIG_FILE="mower"
        else
          CONFIG_FILE="docker"
        fi
        
        # Show build configuration
        echo "Building with configuration:"
        echo "  Board: $BOARD"
        echo "  Branch: $BRANCH"
        echo "  Release: $RELEASE"
        echo "  Desktop: $BUILD_DESKTOP"
        echo "  Mower: $ENABLE_MOWER"
        echo "  Config: $CONFIG_FILE"
        
        # Start the build
        ./build.sh $CONFIG_FILE \
          BOARD=$BOARD \
          BRANCH=$BRANCH \
          RELEASE=$RELEASE \
          BUILD_DESKTOP=$BUILD_DESKTOP \
          BUILD_OPT=image \
          KERNEL_CONFIGURE=no \
          COMPRESS_OUTPUTIMAGE=sha,7z
    
    - name: Prepare artifacts
      run: |
        cd /opt/orangepi-build
        
        # Create artifact directory
        mkdir -p artifacts
        
        # Copy built images
        if [ -d "output/images" ]; then
          cp -r output/images/* artifacts/ || true
        fi
        
        # Copy logs
        if [ -d "output/logs" ]; then
          cp -r output/logs artifacts/ || true
        fi
        
        # Create build info
        cat > artifacts/build-info.txt << EOF
        Build Information
        =================
        Build Date: $(date)
        Board: $BOARD
        Branch: $BRANCH
        Release: $RELEASE
        Desktop: $BUILD_DESKTOP
        Mower Enabled: $ENABLE_MOWER
        
        Git Information:
        Commit: $GITHUB_SHA
        Branch: $GITHUB_REF_NAME
        
        Build Environment:
        Runner: ubuntu-latest
        Workflow: $GITHUB_WORKFLOW
        Run ID: $GITHUB_RUN_ID
        EOF
        
        # Show what was built
        echo "Built artifacts:"
        ls -la artifacts/
        
        # Show disk usage
        df -h
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: orangepi-${{ env.BOARD }}-${{ env.RELEASE }}-${{ env.BRANCH }}-${{ env.ENABLE_MOWER == 'yes' && 'mower' || 'standard' }}
        path: /opt/orangepi-build/artifacts/
        retention-days: 30
        compression-level: 1  # Faster compression since images are already compressed
    
    - name: Create release on tag
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          /opt/orangepi-build/artifacts/*.img.7z
          /opt/orangepi-build/artifacts/*.img.sha
          /opt/orangepi-build/artifacts/build-info.txt
        body: |
          ## Orange Pi Mower Build
          
          - **Board**: ${{ env.BOARD }}
          - **Branch**: ${{ env.BRANCH }}
          - **Release**: ${{ env.RELEASE }}
          - **Desktop**: ${{ env.BUILD_DESKTOP }}
          - **Mower**: ${{ env.ENABLE_MOWER }}
          
          ### Installation
          1. Download the .7z file
          2. Extract the image: `7z x filename.7z`
          3. Flash to SD card: `dd if=filename.img of=/dev/sdX bs=1M`
          4. Boot and enjoy!
          
          Built with GitHub Actions on: ${{ github.run_number }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Cleanup
      if: always()
      run: |
        # Clean up Docker containers and images
        docker system prune -af || true
        
        # Show final disk usage
        df -h 